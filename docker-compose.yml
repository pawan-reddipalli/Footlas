# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: footlas
      POSTGRES_PASSWORD: footlas
      POSTGRES_DB: footlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
